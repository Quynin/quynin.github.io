<!DOCTYPE HTML>
<html>
    <!-- header populated by JS for common header elements -->
    <head id="header">
        <link rel="stylesheet" href="/styles/index-styles.css">
        <!-- link style sheets -->
        <link rel="stylesheet" href="/styles/styles.css">
    </head>


    <!-- body -->
    <body>
        <!--Navigation bar-->
        <div class="topnav">
            <a class="active" href="">Landing</a>
            <a href="/pages/software.html">Software</a>
            <a href="/pages/editing.html">Editing</a>
            <a href="/pages/about-me.html">About Me</a>
        </div>

        <div class="flex-container">
            <div class="column">
                <!-- landing page intro -->
                <div>
                    <h2>Hello!</h2>
                    <p style="display:in-line">I'm</p><p class='cassiopeia'>Cassiopeia!</p>
                    <p>You've stumbled across my website</p>
                    <p>This is where I experiment, iterate, and have fun with my web development ideas freeform! This is all hand-coded!</p>
                    <p>Please check back on this site regularly as I update it</p>
                </div>

                <!-- populates dynamically with script -->
                <div id ="project-timeline" style="color:lightgrey"></div>

            </div>
            
            <div class="column">
                <img class = "landing-picture" src = "images/landingpicture_cassiopeia_2026.jpg">
            </div>
        </div>

        <!-- populated by copyright() function  -->
        <div id="copyright-div"></div>
        

    </body>
    <!-- footer -->
    <footer></footer>

    <!-- Import scripts -->
    <script src="scripts.js"></script>
    <script type="text/javascript">
        
        //Inject the timeline file
        const fp = '/project_timeline.txt';
        const builtString = buildHTMLFromFile(fp);
        //console.log("builtString: " + builtString);
        builtString.then((response) => {
                const target = document.getElementById('project-timeline');
                target.insertAdjacentHTML('afterbegin', response);
            }
        );
        
        //Inject the common header elements
        const headerHTML = getCommonHeaderElements();
        //console.log("header HTML: " + headerHTML);
        headerHTML.then((response) => {
                const target = document.getElementById('header');
                target.insertAdjacentHTML('afterbegin', response);
            }
        );
    </script>
</html>
